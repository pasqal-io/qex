# Train an MLP / descriptor / QCNN XC functional on H2 (CCSD reference) and
# plot the dissociation curve. This is the file-driven equivalent of the old
# CONFIG dict in examples/train_h2.py.
#
# Run it with:
#     qex train --config examples/h2.yaml
# Override any leaf from the CLI, e.g.:
#     qex train --config examples/h2.yaml --training.learning_rate 5e-4
# Switch the SCF gradient mode to implicit differentiation:
#     qex train --config examples/h2.yaml --scf.differentiation implicit

rng: 42
platform: cpu                       # "cpu" or "gpu"
output_dir: results/h2_dissociation

# Logging verbosity. Quiet by default (WARNING+): a normal run shows only the
# tqdm progress bar plus warnings (e.g. non-converged systems). Turn on the
# verbose event log (data gen, SCF compile, per-geometry eval) two ways:
#   debug: true            -> shortcut for logging.level: DEBUG
#   logging.level: <LEVEL> -> global knob; an explicit level always wins.
# Levels, low -> high: TRACE, DEBUG, INFO, SUCCESS, WARNING, ERROR, CRITICAL.
# TRACE prints absolutely everything; INFO shows only the critical pipeline
# milestones (network built, data split, training start, eval results).
debug: false
logging:
  level: INFO                       # e.g. TRACE / DEBUG / INFO; null -> use `debug`

model:
  # "descriptor" (DescriptorXC, grid-size invariant; encoding must be "global"),
  # "mlp"        (LocalMLP for local / GlobalMLP for global encoding),
  # "qcnn"       (quantum convolutional network; encoding "global" only).
  type: descriptor
  # "local":  network outputs exc(r) per electron at each grid point
  #           (LDA-style; E_xc assembled outside as sum exc * rho * w).
  # "global": network outputs the scalar E_xc[rho] directly.
  encoding: global
  exp_model: density                # label used in the plot title only
  n_grid: 1240                      # only used to size GlobalMLP's first Dense layer
  n_atom: 2
  vxc_grad_scale: 1.0
  # Global MLP: [128, 128, 128, 128, 128]   Local MLP: [32, 32]
  hidden_layers: [128, 128, 128, 128, 128]

  descriptor:
    alphas: [0.5, 1.0, 2.0, 4.0]
    scale: 1.0
    rho_floor: 1.0e-10

  qcnn:
    # n_grid must be divisible by n_features ** n_layers.
    n_qubits: 4
    n_features: 4
    n_layers: 2
    n_var_layers: 2
    feature_map: direct
    head_features: [32]
    # List of (type, probability) pairs applied to every gate; types:
    # "bitflip", "amplitude_damping", "depolarizing", "phaseflip".
    # e.g. [["bitflip", 0.01], ["amplitude_damping", 0.01]]
    gate_noise: []
    # Gaussian noise added to each layer's output (emulates readout noise).
    gaussian_noise_std: 0.0

data:
  method: ccsd                      # reference method
  # Basis sets: "sto-3g", "6-31g", "cc-pvdz", "cc-pvqz", "cc-pvtz", etc.
  basis: 631g
  units: Ang
  grid_density: 0
  # PySCF's OWN print level for the reference solver (CCSD/RKS/FCI). This is the
  # solver's stdout (SCF iteration table, timings), separate from QEX's loguru
  # log above. 0 = silent (default), 3 = normal SCF table, 4 = info, 5+ = debug.
  verbose: 0
  # Path to the precomputed single-file (HDF5) dataset. This .h5 IS the cache and
  # the checkpoint: generation writes each system as it finishes, so a run that
  # is killed/diverges can be restarted (completed systems are reused). null ->
  # default to <output_dir>/dataset.h5. Point it at an existing file to reuse
  # precomputed reference data instead of regenerating it.
  dataset_file: null
  # Set false to build the dataset in memory only (no .h5 written/reused).
  cache_dataset: true
  # Explicit train / validation / test split (bond lengths in Angstrom).
  # Keep the three sets disjoint for an honest test metric.
  train_bond_lengths: [0.5, 0.74, 1.0, 1.5, 2.0, 2.5, 3.0]
  val_bond_lengths:   [0.6, 0.9, 1.2]
  test_bond_lengths:  [0.8, 1.3, 1.75, 2.25, 2.75]
  # Dataset generation is incremental + resumable: each system is written to
  # output_dir/dataset.h5 as it finishes, so an interrupted/diverged run can be
  # restarted (completed systems are reused). Non-converged systems are recorded
  # and excluded from training; set retry_failed: true to recompute them.
  retry_failed: false
  # Dissociation profile (curve-specific eval). Set eval_dissociation: false to
  # only produce the general test-set parity plot.
  eval_dissociation: true
  eval_min: 0.5
  eval_max: 3.01
  eval_points: 30

training:
  learning_rate: 1.0e-4
  n_iterations: 1000
  log_every: 5
  energy_weight: 1.0
  density_weight: 1.0
  grad_clip: 0.5                    # null to disable gradient clipping
  # Validation runs every n_val_iter steps (separate jitted closure, so it does
  # not slow the training step). patience: stop early after this many
  # validations without improvement (null = no early stopping).
  n_val_iter: 50
  patience: 100

# SCF / KS-solve settings. `run_experiment` reads these from `scf.*` (see
# qex.training.experiment._scf_kwargs).
scf:
  # How gradients flow through the SCF fixed point during TRAINING:
  #   "unroll"   (default): backprop through every SCF cycle. The reverse graph
  #              grows linearly with max_cycle -- fine for cheap XC (MLP), but the
  #              QCNN's unrolled value_and_grad trace pushes XLA compile into
  #              minutes.
  #   "implicit": differentiate the converged fixed point via the implicit
  #              function theorem (qex.scf.implicit_diff). The forward SCF runs
  #              with no autodiff graph and the gradient comes from a single
  #              linear solve, so compile/memory cost is independent of max_cycle
  #              -- faster to train and scale. Trade-offs: the energy loss is
  #              taken at the converged density only (not summed across cycles, so
  #              ks_iter_to_ignore / ignore_ks_iter has no effect), DIIS only
  #              accelerates the forward solve, and it needs the SCF to actually
  #              reach a fixed point (use enough max_cycle). Requires the
  #              twice-differentiable eigensolver (eigh.eigh_gen).
  # Eval (rks_energy) is forward-only and ignores this switch.
  differentiation: implicit
  # KS "solve" step inside each SCF cycle. Choose based on system size AND
  # whether fractional occupation (frac_enabled below) is on:
  #
  #   solver   frac_enabled=1 (smearing)   frac_enabled=0 (integer)   notes
  #   ------   -------------------------   ------------------------   -----
  #   dense    YES (default, this example) YES                        exact;
  #            best for small systems; works under the training vmap.
  #   purify   NO  -> raises ValueError    YES                        GEMM-only,
  #            density-matrix purification; scales best for large single systems.
  #   lobpcg   only when basis is large    only when basis is large   iterative;
  #            enough for a LUMO buffer     (needs 5*N_occ < n_basis)  lowest-k
  #            (5*(N_occ+buffer)<n_basis)                              eigenpairs.
  #            NOTE: lobpcg cannot run in the *training* loop at all -- it needs a
  #            compile-time electron count, but training vmaps over samples so
  #            N_occ is traced. It raises a clear TypeError there. Use it only
  #            for direct/large-single-system solves.
  solver: dense
  max_cycle: 15
  use_diis: true
  diis_max_vec: 15
  diis_min_vec: 2
  diis_start_cycle: 1
  diis_damping: 0.0
  # Fractional-occupation (finite-temperature) smearing.
  frac_enabled: 1
  frac_theta: 0.04
  frac_mu: null
  frac_mu_shift: 0.001
  frac_step_grad: 0.6
  frac_max_steps: 100

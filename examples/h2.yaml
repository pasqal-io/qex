# Train an MLP / descriptor / QCNN XC functional on H2 (CCSD reference) and
# plot the dissociation curve. This is the file-driven equivalent of the old
# CONFIG dict in examples/train_h2.py.
#
# Run it with:
#     qex-train --config examples/h2.yaml
# Override any leaf from the CLI, e.g.:
#     qex-train --config examples/h2.yaml --training.learning_rate 5e-4

rng: 42
platform: cpu                       # "cpu" or "gpu"
output_dir: results/h2_dissociation

model:
  # "descriptor" (DescriptorXC, grid-size invariant; encoding must be "global"),
  # "mlp"        (LocalMLP for local / GlobalMLP for global encoding),
  # "qcnn"       (quantum convolutional network; encoding "global" only).
  type: descriptor
  # "local":  network outputs exc(r) per electron at each grid point
  #           (LDA-style; E_xc assembled outside as sum exc * rho * w).
  # "global": network outputs the scalar E_xc[rho] directly.
  encoding: global
  exp_model: density                # label used in the plot title only
  n_grid: 1240                      # only used to size GlobalMLP's first Dense layer
  n_atom: 2
  vxc_grad_scale: 1.0
  # Global MLP: [128, 128, 128, 128, 128]   Local MLP: [32, 32]
  hidden_layers: [128, 128, 128, 128, 128]

  descriptor:
    alphas: [0.5, 1.0, 2.0, 4.0]
    scale: 1.0
    rho_floor: 1.0e-10

  qcnn:
    # n_grid must be divisible by n_features ** n_layers.
    n_qubits: 2
    n_features: 2
    n_layers: 2
    n_var_layers: 1
    feature_map: direct
    head_features: [32]
    # List of (type, probability) pairs applied to every gate; types:
    # "bitflip", "amplitude_damping", "depolarizing", "phaseflip".
    # e.g. [["bitflip", 0.01], ["amplitude_damping", 0.01]]
    gate_noise: []
    # Gaussian noise added to each layer's output (emulates readout noise).
    gaussian_noise_std: 0.0

data:
  method: ccsd                      # reference method
  basis: 631g
  units: Ang
  grid_density: 0
  # Explicit train / validation / test split (bond lengths in Angstrom).
  # Keep the three sets disjoint for an honest test metric.
  train_bond_lengths: [0.5, 0.74, 1.0, 1.5, 2.0, 2.5, 3.0]
  val_bond_lengths:   [0.6, 0.9, 1.2]
  test_bond_lengths:  [0.8, 1.3, 1.75, 2.25, 2.75]
  # Dataset generation is incremental + resumable: each system is written to
  # output_dir/dataset.h5 as it finishes, so an interrupted/diverged run can be
  # restarted (completed systems are reused). Non-converged systems are recorded
  # and excluded from training; set retry_failed: true to recompute them.
  retry_failed: false
  # Dissociation profile (curve-specific eval). Set eval_dissociation: false to
  # only produce the general test-set parity plot.
  eval_dissociation: true
  eval_min: 0.5
  eval_max: 3.01
  eval_points: 30

training:
  learning_rate: 1.0e-4
  n_iterations: 1000
  log_every: 5
  energy_weight: 1.0
  density_weight: 1.0
  grad_clip: 0.5                    # null to disable gradient clipping
  # Validation runs every n_val_iter steps (separate jitted closure, so it does
  # not slow the training step). patience: stop early after this many
  # validations without improvement (null = no early stopping).
  n_val_iter: 50
  patience: 5

scf:
  max_cycle: 15
  use_diis: true
  diis_max_vec: 15
  diis_min_vec: 2
  diis_start_cycle: 1
  diis_damping: 0.0
  # Fractional-occupation (finite-temperature) smearing.
  frac_enabled: 1
  frac_theta: 0.04
  frac_mu: null
  frac_mu_shift: 0.001
  frac_step_grad: 0.6
  frac_max_steps: 100
